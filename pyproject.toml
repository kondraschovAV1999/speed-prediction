[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speed-estimation"
version = "0.1.0"
description = "Vehicle speed estimation from video (M1 synthetic vertical slice)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "lightning>=2.2",
    "torchmetrics>=1.3",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "mlflow>=2.10",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
video = ["opencv-python"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow tests",
    "integration: end-to-end integration tests",
    "gpu: tests requiring CUDA",
    "mlflow: tests requiring MLflow",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
