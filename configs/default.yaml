defaults:
  - _self_
  - dataset: comma2k19
  - encoder: resnet18
  - temporal: lstm
  - visualization: default
  - head: mlp
  - experiment: baseline
  - override hydra/job_logging: disabled   # we configure logging ourselves
  - override hydra/hydra_logging: disabled

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      encoder: resnet18
      temporal: gru, lstm, convlstm
  run:
    dir: output/hydra/${now:%Y%m%d_%H%M%S}   # keep Hydra's own files under output/
  job:
    chdir: false                              # never change the working directory
  output_subdir: null

paths:
  output_root: output
  data_root: data

experiment:
  name: baseline
  seed: 42
  deterministic: false      # true => torch.use_deterministic_algorithms(True, warn_only=True)

# `data` is provided by the dataset group (see dataset/synthetic.yaml)

preprocessing:
  image_size: [ 32, 32 ]      # [H, W]
  normalize: true
  mean: [ 0.485, 0.456, 0.406 ]   # fixed constants, NOT fitted on data
  std: [ 0.229, 0.224, 0.225 ]

# `encoder`, `temporal`, and `head` are provided by their config groups.
model:
  name: encoder_recurrent   # label only (used in the standalone model export)
  checkpoint: null

training:
  batch_size: 64
  epochs: 100
  learning_rate: 0.002
  weight_decay: 0.00009
  optimizer: adamw
  loss: mse                 # mse | l1 | mae | rmse | huber
  huber_delta: 2.0         # mph; only used when loss=huber
  monitor: val/mae_mph
  early_stopping_patience: 5
  gradient_clip_val: null
  accelerator: auto
  devices: 1
  precision: "bf16-mixed"     # bf16 mixed precision (fast path on Ada/4070 Tensor Cores)
  matmul_precision: high      # highest | high (TF32) | medium (bf16 matmul)
  num_workers: 0


postprocessing:
  clip: { enabled: true, min_mph: 0.0, max_mph: null }
  smoothing: { method: none, ema_alpha: 0.5, median_window: 5 }   # none | ema | median (causal)
  stationary:
    enabled: true
    enter_threshold_mph: 1.5      # speed <= enter for N consecutive frames -> STOPPED
    exit_threshold_mph: 4       # speed >  exit  for M consecutive frames -> MOVING
    enter_persistence_frames: 2
    exit_persistence_frames: 5
    initial_state: moving

evaluation:
  stationary_label_threshold_mph: 2.0   # ground truth only: true_stationary = true_speed <= this
  speed_buckets: # lower bound inclusive, upper exclusive
    - { name: '0-5',    min_mph: 0,  max_mph: 5 }
    - { name: '5-10',    min_mph: 5,  max_mph: 10 }
    - { name: "10-20",    min_mph: 10,  max_mph: 20 }
    - { name: "20-40", min_mph: 20, max_mph: 40 }
    - { name: "40-60", min_mph: 40, max_mph: 60 }
    - { name: "60+",   min_mph: 60, max_mph: null }
  splits_to_evaluate: [ val, test ]
  device: auto

benchmark:
  enabled: true
  device: auto
  num_warmup: 2
  num_iters: 3

tracking:
  enabled: true
  backend: mlflow
  mlflow:
    tracking_uri: null        # null => local store under output/mlflow (see WP8)
    experiment_name: speed-estimation

logging:
  level: INFO
